name: Update ski jobs
on:
  schedule:
    - cron: "0 20 * * *"   # every day at 20:00 UTC
  workflow_dispatch: {}     # lets you run it manually from the Actions tab
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scrape
        run: python ski_jobs_scraper.py
      - name: Merge
        run: python merge.py
      - name: Commit changes
        run: |
          git config user.name "snowhire-bot"
          git config user.email "bot@users.noreply.github.com"
          git add jobs.json scraped.json
          git diff --cached --quiet || git commit -m "Update jobs $(date -u +%F)"
          git push
